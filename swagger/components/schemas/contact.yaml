type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: '672e559aefd1ec206c1b77a8'
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+1234567890'
  email:
    description: "Contact's email"
    type: string
    example: 'johndoe@gmail.com'
  isFavourite:
    description: 'Whether the contact is marked as favourite'
    type: boolean
    example: false
    default: false
  contactType:
    description: 'Type of contact'
    type: string
    enum: ['work', 'home', 'personal']
    example: 'personal'
    default: 'personal'
  userId:
    description: "User's id who owns the contact"
    type: string
    example: '66a92312c1de214c68f17d10'
  photo:
    description: "Contact's photo URL"
    type: string
    example: 'https://res.cloudinary.com/dha4xvgfi/image/upload/v1724438545/photo.jpg'
    default: null
  createdAt:
    description: 'Timestamp when the contact was created'
    type: string
    format: date-time
    example: '2025-01-26T12:34:56Z'
  updatedAt:
    description: 'Timestamp when the contact was last updated'
    type: string
    format: date-time
    example: '2025-02-01T08:22:11Z'
